services:
  asterisk:
    # Prefer the published image; override with `docker compose up --build` for local builds.
    image: ${ASTERISK_IMAGE:-ghcr.io/pmastalerz/asterisk:latest}
    build:
      context: .
      args:
        # All four are required by the Dockerfile. Copy `.env.example` → `.env` before building.
        ASTERISK_VERSION: ${ASTERISK_VERSION}
        ASTERISK_SHA256: ${ASTERISK_SHA256}
        VERSION: ${VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    container_name: asterisk
    # Host networking is strongly recommended for SIP + RTP.
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Warsaw}
      # Override the built-in `-W` (light-bg) with e.g. "-B" (dark bg) or "-n" (no color).
      - ASTERISK_TERMINAL_OPTS=${ASTERISK_TERMINAL_OPTS-}
    volumes:
      # Config (dialplan, pjsip, …). Drop *.conf.template files in here and the
      # entrypoint will render them via envsubst on start.
      - ./config:/etc/asterisk
      # Persist only mutable data — do NOT mount all of /var/lib/asterisk
      # (that hides image documentation/ and breaks Stasis on empty appdata).
      - ./db:/var/lib/asterisk/db
      - ./keys:/var/lib/asterisk/keys
      - ./sounds:/var/lib/asterisk/sounds
      - ./log:/var/log/asterisk
      - ./spool:/var/spool/asterisk
    # Bridge mode (only if you drop network_mode: host):
    # ports:
    #   - "5060:5060/udp"
    #   - "5060:5060/tcp"
    #   - "10000-20000:10000-20000/udp"
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.icon: "https://www.asterisk.org/wp-content/uploads/asterisk-logo.png"
      net.unraid.docker.shell: "bash"
