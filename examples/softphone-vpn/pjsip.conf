[global]
type=global
user_agent=asterisk-docker

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Set when softphones need a fixed Contact / SDP address:
; external_media_address=10.0.0.10
; external_signaling_address=10.0.0.10
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[endpoint-basic](!)
type=endpoint
context=from-internal
disallow=all
allow=g722
allow=ulaw
allow=alaw
allow=vp8
allow=h264
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733
max_audio_streams=1
max_video_streams=1

[auth-userpass](!)
type=auth
auth_type=userpass

[aor-single](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

[100](endpoint-basic)
auth=100
aors=100
callerid="User 100" <100>

[100](auth-userpass)
username=100
password=CHANGE_ME_100

[100](aor-single)

[200](endpoint-basic)
auth=200
aors=200
callerid="User 200" <200>

[200](auth-userpass)
username=200
password=CHANGE_ME_200

[200](aor-single)
