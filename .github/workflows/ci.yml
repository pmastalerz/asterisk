name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  # Required check name stays stable for branch protection.
  build-and-test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Try to pull published image
        id: pull
        run: |
          set -euo pipefail
          if docker pull "${{ env.IMAGE }}" 2>/dev/null; then
            echo "have_image=true" >> "$GITHUB_OUTPUT"
            echo "Using published image ${{ env.IMAGE }}"
          else
            echo "have_image=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Published image not available yet — falling back to local amd64 build (bootstrap)"
          fi

      - name: Set up Docker Buildx (fallback build)
        if: steps.pull.outputs.have_image == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build fallback image (bootstrap only)
        if: steps.pull.outputs.have_image == 'false'
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg ASTERISK_VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg ASTERISK_SHA256="$(tr -d '[:space:]' < ASTERISK_SHA256)" \
            --build-arg VERSION=ci-fallback \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t "${{ env.IMAGE }}" \
            .

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${{ env.IMAGE }}"
