name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_build:
        description: Force a full multi-arch image rebuild and publish
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest

jobs:
  changes:
    name: Detect compile vs verify
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.decide.outputs.compile }}
      verify: ${{ steps.decide.outputs.verify }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Paths filter
        id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            compile:
              - 'VERSION'
              - 'ASTERISK_SHA256'
              - 'Dockerfile'
              - '.dockerignore'
              - 'build/**'

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_build }}" = "true" ]; then
              echo "compile=true" >> "$GITHUB_OUTPUT"
              echo "verify=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: full rebuild"
            else
              echo "compile=false" >> "$GITHUB_OUTPUT"
              echo "verify=true" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: smoke against latest only"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "Tag push: full rebuild + GitHub Release"
          elif [ "${{ steps.filter.outputs.compile }}" = "true" ]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "Compile inputs changed — full Asterisk compile + publish"
          else
            echo "compile=false" >> "$GITHUB_OUTPUT"
            echo "verify=true" >> "$GITHUB_OUTPUT"
            echo "Same Asterisk build inputs — smoke tests only (no image rebuild)"
          fi

  verify:
    name: Smoke against latest
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pull published image
        run: |
          set -euo pipefail
          echo "No compile needed — testing ${{ env.IMAGE_LATEST }}"
          docker pull "${{ env.IMAGE_LATEST }}"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${{ env.IMAGE_LATEST }}"

  # Native builders (amd64 + arm64) — much faster than QEMU emulation.
  build:
    name: Build ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.compile == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read build args
        id: ver
        run: |
          echo "asterisk_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "asterisk_sha256=$(tr -d '[:space:]' < ASTERISK_SHA256)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ASTERISK_VERSION=${{ steps.ver.outputs.asterisk_version }}
            ASTERISK_SHA256=${{ steps.ver.outputs.asterisk_sha256 }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: |
            type=gha,scope=asterisk-${{ matrix.pair }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.pair }}
          cache-to: |
            type=gha,mode=max,scope=asterisk-${{ matrix.pair }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge, smoke & release
    needs: [changes, build]
    if: needs.changes.outputs.compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Asterisk version
        id: ver
        run: echo "asterisk_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.asterisk_version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.asterisk_version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Create manifest list
        id: push
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_ARGS+=("-t" "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          DIGEST_ARGS=()
          for f in /tmp/digests/*; do
            [ -f "$f" ] || continue
            DIGEST_ARGS+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$(basename "$f")")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_ARGS[@]}"

          # Resolve digest of the first tag for smoke/release notes.
          FIRST_TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          DIGEST="$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "first_tag=${FIRST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Pull amd64 image for smoke test
        run: |
          set -euo pipefail
          REF="${{ steps.push.outputs.first_tag }}"
          echo "Pulling $REF (linux/amd64)"
          docker pull --platform linux/amd64 "$REF"
          docker tag "$REF" asterisk:release-test

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh asterisk:release-test

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.asterisk_version }}
            ```

            Upstream Asterisk: **${{ steps.ver.outputs.asterisk_version }}**

            ## Digests

            ```
            ${{ steps.push.outputs.digest }}
            ```
