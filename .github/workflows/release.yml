name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_build:
        description: Force a full multi-arch image rebuild and publish
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest

jobs:
  changes:
    name: Detect compile vs verify
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.decide.outputs.compile }}
      verify: ${{ steps.decide.outputs.verify }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full Asterisk compile only when upstream version or build inputs change.
      - name: Paths filter
        id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            compile:
              - 'VERSION'
              - 'Dockerfile'
              - '.dockerignore'
              - 'build/**'

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_build }}" = "true" ]; then
              echo "compile=true" >> "$GITHUB_OUTPUT"
              echo "verify=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: full rebuild"
            else
              echo "compile=false" >> "$GITHUB_OUTPUT"
              echo "verify=true" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: smoke against latest only"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "Tag push: full rebuild + GitHub Release"
          elif [ "${{ steps.filter.outputs.compile }}" = "true" ]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "VERSION / Dockerfile / build/* changed — full Asterisk compile + publish"
          else
            echo "compile=false" >> "$GITHUB_OUTPUT"
            echo "verify=true" >> "$GITHUB_OUTPUT"
            echo "Same Asterisk build inputs — smoke tests only (no image rebuild)"
          fi

  # Same VERSION / no build-input changes: don't recompile; just check we didn't break runtime tests.
  verify:
    name: Smoke against latest
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull published image
        run: |
          set -euo pipefail
          echo "No compile needed — testing ${{ env.IMAGE_LATEST }}"
          docker pull "${{ env.IMAGE_LATEST }}"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "${{ env.IMAGE_LATEST }}"

  build-test-publish:
    name: Build, test & publish
    needs: changes
    if: needs.changes.outputs.compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Asterisk version
        id: ver
        run: |
          echo "asterisk_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.asterisk_version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.asterisk_version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push multi-arch
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ASTERISK_VERSION=${{ steps.ver.outputs.asterisk_version }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: |
            type=gha,scope=asterisk-release
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=asterisk-release
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Pull amd64 image for smoke test
        run: |
          set -euo pipefail
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          echo "Pulling $REF (linux/amd64)"
          docker pull --platform linux/amd64 "$REF"
          docker tag "$REF" asterisk:release-test

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh asterisk:release-test

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.asterisk_version }}
            ```

            Upstream Asterisk: **${{ steps.ver.outputs.asterisk_version }}**

            ## Digests

            ```
            ${{ steps.push.outputs.digest }}
            ```
