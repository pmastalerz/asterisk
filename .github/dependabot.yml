version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      # `include: scope` alone yields "chore(deps): bump ..." — no manual
      # prefix needed. Combining prefix with include:scope double-nests
      # the parens: "chore(deps)(deps): bump ...".
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker
    # Only track the base image line; ARG-only bumps (bookworm → trixie) will
    # come through here as a proper PR.
    ignore:
      - dependency-name: "debian"
        update-types:
          - version-update:semver-major
