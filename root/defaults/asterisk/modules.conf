[modules]
autoload=yes

; Legacy SIP (removed/disabled in modern builds).
noload => chan_sip.so

; Database / ODBC — not part of the default image profile; avoid noisy load failures.
noload => res_odbc.so
noload => res_odbc_transaction.so
noload => res_config_odbc.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cel_odbc.so
noload => func_odbc.so

; Optional telephony / desktop bits unused in a typical container PBX.
noload => chan_console.so
noload => chan_alsa.so
noload => chan_oss.so
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so

; Sound/MP3 packs are not part of the default compile profile.
noload => format_mp3.so
