; Container-oriented paths / process identity.
; Everything else comes from Asterisk sample configs on first start.
;
; Persist only mutable subdirs (db / keys / sounds) — leave documentation/
; and other image content under /var/lib/asterisk unmounted.

[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk/db
astkeydir => /var/lib/asterisk/keys
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
timestamp = yes
runuser = asterisk
rungroup = asterisk
